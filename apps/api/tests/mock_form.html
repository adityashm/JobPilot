<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Job Application Form</title>
</head>
<body>
    <h1>Job Application - Senior Python Engineer</h1>
    <form id="job-application-form">
        <div>
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" required />
        </div>
        <div>
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />
        </div>
        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" />
        </div>
        <div>
            <label for="linkedin_url">LinkedIn Profile</label>
            <input type="url" id="linkedin_url" name="linkedin_url" />
        </div>
        <div>
            <label for="github_url">GitHub Profile</label>
            <input type="url" id="github_url" name="github_url" />
        </div>
        <div>
            <label for="experience_years">Years of Experience</label>
            <input type="text" id="experience_years" name="experience_years" />
        </div>
        <div>
            <label for="resume_upload">Upload Resume (PDF/DOCX)</label>
            <input type="file" id="resume_upload" name="resume_upload" />
        </div>
        <div>
            <label for="why_interested">Why are you interested in this role?</label>
            <textarea id="why_interested" name="why_interested"></textarea>
        </div>
        <div>
            <label>Current Location (No ID attribute on input)</label>
            <input type="text" name="city" placeholder="Current City" />
        </div>
        <div>
            <label for="work_authorization">Work Authorization</label>
            <input type="text" id="work_authorization" name="work_authorization" />
        </div>
        <button type="submit" id="submit_btn">Submit Application</button>

    </form>
</body>
</html>
